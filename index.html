<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Telinha">
<meta name="description" content="Acompanhe suas séries e filmes, do primeiro episódio ao último.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Minha Telinha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: coluna única. Início = dois cartões de tipo + cinco cartões de situação; a lista abre como subtela; folha inferior para editar; nav flutuante em vidro.
   Identidade: escuro único (decisão de marca), luz ambiente verde-azulada no alto e roxa embaixo, cartões de vidro com borda de neon na cor de cada situação. */
:root{
  --bg:#06070b;--panel:#0e1018;--ink:#f3f4f8;--ink-2:#a4a9b9;--ink-3:#6c7182;
  --line:rgba(255,255,255,.08);--glass:rgba(255,255,255,.03);--glass-2:rgba(255,255,255,.06);
  --teal:#22c1d6;--cyan:#3fd8f2;--violet:#8f74f5;--green:#2fd38a;--pink:#f0468f;--gold:#f2c14b;
  --grad:linear-gradient(90deg,#ffffff 0%,#c9bcff 38%,#8f74f5 62%,#3fd8f2 100%);
  --btn:linear-gradient(120deg,#8f74f5,#38bfe4);
  --shadow:0 24px 50px rgba(0,0,0,.55);--scrim:rgba(2,3,6,.74);
  --display:'Outfit','Segoe UI',system-ui,sans-serif;--body:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0;min-height:100%;
  padding-block:0 132px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 42% at 0% 6%,rgba(24,128,140,.40),transparent 70%),
             radial-gradient(55% 42% at 100% 96%,rgba(98,64,190,.32),transparent 70%),
             radial-gradient(45% 26% at 55% 100%,rgba(150,70,40,.13),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--c)}
.eyebrow{font:700 11px var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);margin:0}
.ul{display:block;width:30px;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c);margin:10px 0 12px}

/* cartão de vidro com borda de neon */
.g{--c:var(--violet);position:relative;border-radius:20px;isolation:isolate;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,transparent) 0%,transparent 40%),linear-gradient(180deg,var(--glass-2),var(--glass));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(180deg,var(--c) 0%,color-mix(in srgb,var(--c) 30%,transparent) 22%,rgba(255,255,255,.07) 55%,rgba(255,255,255,.035));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.g::after{content:"";position:absolute;left:14%;right:14%;top:-1px;height:2px;border-radius:2px;background:var(--c);filter:blur(5px);opacity:.75;pointer-events:none}
.g.hot{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 65%,transparent),0 0 30px color-mix(in srgb,var(--c) 32%,transparent),var(--shadow)}
.g.hot::before{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 55%,transparent))}

/* cabeçalho */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 0 6px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--btn);box-shadow:0 6px 18px rgba(120,100,240,.35)}
.mark .ic{width:18px;height:18px;color:#fff;stroke-width:1.9}
.bn{font:600 18px/1 var(--display);letter-spacing:-.01em}
.pill{--c:var(--violet);display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);
  font:800 10.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#fff)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

/* início */
.hero{padding:26px 0 22px}
.h-big{font:300 clamp(34px,10vw,46px)/1.06 var(--display);letter-spacing:-.02em;margin:10px 0 0;text-wrap:balance}
.types{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ty{display:flex;flex-direction:column;align-items:flex-start;min-height:150px;padding:16px;color:var(--ink);transition:opacity .25s,transform .2s}
.ty:not(.hot){opacity:.66}
.ty:active,.st:active{transform:scale(.98)}
.t-l{font:600 22px/1.1 var(--display);margin-top:auto;padding-top:18px}
.t-m{font-size:12.5px;color:var(--ink-2)}
.sec{margin:30px 0 12px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{display:flex;flex-direction:column;min-height:176px;padding:16px;color:var(--ink);transition:transform .2s}
.sts > :last-child{grid-column:1/-1;min-height:0}
.st-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.st-n{font:300 40px/.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.st.zero .st-n{color:var(--ink-3)}
.st-l{font:600 18px/1.15 var(--display);margin-top:18px}
.st-d{font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.helper{margin-top:22px;padding:20px;text-align:center}
.helper b{display:block;font:600 19px var(--display);margin-bottom:4px}
.helper p{margin:0;color:var(--ink-2);font-size:13.5px}

/* lista */
.topbar{padding:16px 0 4px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 15px 9px 10px;border-radius:99px;background:var(--glass-2);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.back .ic{width:16px;height:16px;color:var(--ink);stroke-width:2.2}
.l-head{padding:14px 0 6px}
.l-head h2{margin:8px 0 0;font:300 clamp(30px,9vw,38px)/1.05 var(--display);letter-spacing:-.02em}
.l-head h2 span{color:var(--ink-3);font-size:.55em;margin-left:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{--c:var(--violet);flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--ink-2);font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent);color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--c) 30%,transparent)}
.tools{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:8px 0 4px}
.field,input[type=text],input[type=number],select,textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 15px var(--body)}
select option{background:var(--panel);color:var(--ink)}
::placeholder{color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.card{display:flex;gap:14px;padding:14px}
.poster{flex:none;width:74px;height:108px;border-radius:14px;display:grid;place-items:center;font:600 24px var(--display);color:#fff;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 22px rgba(0,0,0,.45)}
.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 45%)}
.poster small{position:absolute;bottom:7px;left:0;right:0;text-align:center;font:800 8.5px var(--body);letter-spacing:.18em;opacity:.85}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.info h3{margin:0;font:600 17px/1.2 var(--display);overflow-wrap:anywhere}
.info .ul{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;text-shadow:0 0 10px rgba(242,193,75,.45)}
.note{font-size:13px;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere}
.now{display:flex;align-items:stretch;gap:8px}
.now span{display:flex;flex-direction:column;min-width:68px;padding:6px 12px;border-radius:13px;background:var(--glass-2);border:1px solid var(--line);font:400 22px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.now small{font:800 9px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.now.on span{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 60%,transparent);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--c) 28%,transparent)}
.now.on small{color:color-mix(in srgb,var(--c) 60%,#fff)}
.now .minus{align-self:center;width:34px;height:34px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line);font-size:18px;line-height:1;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.sbtn{display:inline-block;padding:8px 12px;border-radius:11px;font-weight:700;font-size:12.5px;background:var(--glass-2);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.sbtn.pri{background:color-mix(in srgb,var(--c) 20%,transparent);border-color:color-mix(in srgb,var(--c) 65%,transparent);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--c) 25%,transparent)}
.empty{margin-top:14px;padding:30px 18px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font:600 19px var(--display);margin-bottom:6px}

/* botões */
.btn{display:inline-block;padding:14px 22px;border-radius:15px;font-weight:800;background:var(--btn);color:#fff;text-align:center;box-shadow:0 10px 26px rgba(110,90,240,.35)}
.btn.ghost{background:var(--glass-2);border:1px solid var(--line);box-shadow:none}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1}

/* resumo */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px}
.stat b{display:block;font:300 34px/1 var(--display);font-variant-numeric:tabular-nums;margin-bottom:6px}
.stat span{color:var(--ink-2);font-size:12.5px;font-weight:600}
.panel{padding:16px}
.panel p{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.bars{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--glass-2)}
.bars div{box-shadow:0 0 12px currentColor}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;box-shadow:0 0 8px currentColor}
.bk{min-height:90px;font:12px ui-monospace,monospace}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .bar{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:6px;border-radius:99px;background:rgba(14,16,24,.72);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
nav button{display:flex;align-items:center;gap:6px;padding:11px 18px;border-radius:99px;font-weight:700;font-size:13.5px;color:var(--ink-3)}
nav button .ic{width:18px;height:18px;color:currentColor;stroke-width:2}
nav button[aria-current="page"]{background:rgba(255,255,255,.08);color:var(--ink)}
nav .add{width:50px;height:50px;padding:0;justify-content:center;color:#fff;background:var(--btn);box-shadow:0 0 22px rgba(120,100,240,.45)}
nav .add .ic{width:22px;height:22px;stroke-width:2.4}

/* folha de edição */
.sheetbg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;background:var(--panel);
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.g{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,var(--panel)) 0%,var(--panel) 30%)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font:300 26px var(--display);letter-spacing:-.01em}
label,.lbl{display:block;font:800 10.5px var(--body);color:var(--ink-3);margin:18px 0 7px;letter-spacing:.2em;text-transform:uppercase}
textarea{min-height:80px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars-in{display:flex;align-items:center;gap:4px}
.stars-in button{font-size:30px;line-height:1;color:rgba(255,255,255,.14)}
.stars-in button.on{color:var(--gold);text-shadow:0 0 12px rgba(242,193,75,.5)}
.check{margin-top:8px}

/* capa */
.cover{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;overflow-x:hidden;overflow-y:auto;background:var(--bg);
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.cover > *:not(.amb){position:relative;z-index:1}
.cover .eyebrow{color:#a990ff;text-shadow:0 0 14px rgba(143,116,245,.7)}
.cover h2{font:300 clamp(46px,14vw,72px)/1 var(--display);letter-spacing:-.03em;margin:16px 0 0}
.cover .tag{margin:16px 0 0;color:var(--ink-2);max-width:30ch;font-size:15.5px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.tv{width:min(84vw,340px);margin:44px auto 0}
.tv-ant{position:relative;height:40px;margin-bottom:-4px}
.tv-ant i{position:absolute;bottom:0;left:50%;width:2px;height:46px;border-radius:2px;transform-origin:50% 100%;background:linear-gradient(0deg,rgba(255,255,255,.08),var(--cyan))}
.tv-ant i:first-child{transform:rotate(-34deg)}.tv-ant i:last-child{transform:rotate(30deg)}
.tv-ant i::before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.tv-body{padding:12px 12px 22px;border-radius:30px}
.tv-led{position:absolute;bottom:8px;right:22px;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.screen{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:radial-gradient(110% 90% at 50% 42%,#1d1846 0%,#0b0c18 72%);box-shadow:inset 0 0 44px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.07)}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.11),transparent 38%)}
.onair{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;font:800 9px var(--body);letter-spacing:.22em;color:var(--ink-2)}
.onair::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.flag{display:flex;justify-content:center;perspective:320px;font:600 clamp(34px,11vw,50px)/1 var(--display);letter-spacing:-.01em}
.flag.sm{font:400 clamp(18px,5.4vw,24px)/1 var(--display);letter-spacing:.06em}
.flag span{display:inline-block;transform-origin:50% 100%;white-space:pre;
  background:var(--grad);background-size:calc(var(--n) * 100%) 100%;background-position:calc(var(--j) / (var(--n) - 1) * 100%) 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(143,116,245,.4))}
.flag.sm span{background:none;color:var(--ink-2);filter:none}
.tv-stand{width:34%;height:12px;margin:0 auto;border-radius:0 0 14px 14px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.tv-foot{width:52%;height:4px;margin:4px auto 0;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(143,116,245,.6),transparent);box-shadow:0 0 16px rgba(143,116,245,.5)}
.cover .btn{margin-top:30px;padding:16px 48px;font-size:16px;border-radius:99px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(20,22,32,.94);border:1px solid var(--line);color:var(--ink);
  padding:11px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:30;max-width:90%;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms)}
  @keyframes rise{from{opacity:.001;transform:translateY(14px)}}
  .g.hot::after{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.4}}
  .cover > *:not(.amb){animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .flag span{animation:flag 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * .15s - 2.8s)}
  @keyframes flag{0%,100%{transform:translateY(0) rotateX(0) skewY(0)}25%{transform:translateY(-6px) rotateX(20deg) skewY(-4deg)}50%{transform:translateY(0) rotateX(0) skewY(0)}75%{transform:translateY(6px) rotateX(-20deg) skewY(4deg)}}
  .tv-led{animation:breathe 2.4s ease-in-out infinite}
  .cover .tv{animation-delay:.08s}.cover .tag{animation-delay:.16s}.cover .pills{animation-delay:.24s}.cover .btn{animation-delay:.32s}
}
@media (max-width:360px){.st-n{font-size:34px}.ty{min-height:136px}}
</style>

<script>
(function(){
'use strict';
var KEY='telinha.v1',PKEY='telinha.prefs';
var S={view:'home',type:'serie',status:'watching',theme:'all',q:'',cover:true,items:[],edit:null,toast:'',armed:'',sample:false,focusTitle:false};
var P={};
var STAT={watching:'Assistindo',paused:'Na geladeira',planned:'Quero ver',done:'Concluído',dropped:'Abandonado'};
var SHELF={watching:'Assistindo',paused:'Na geladeira',planned:'Quero ver',done:'Concluídos',dropped:'Abandonados'};
var DESC={
  serie:{watching:'Em andamento, com temporada e episódio.',paused:'Pausadas. O ponto onde parou fica guardado.',planned:'A fila do que você quer começar.',done:'Vistas até o último episódio.',dropped:'Ficaram pelo caminho.'},
  filme:{watching:'Começados e ainda não terminados.',paused:'Pausados para ver depois.',planned:'A fila do que você quer ver.',done:'Vistos até os créditos.',dropped:'Ficaram pelo caminho.'}};
var ORDER=['watching','paused','planned','done','dropped'];
var COL={watching:'var(--pink)',paused:'var(--teal)',planned:'var(--violet)',done:'var(--green)',dropped:'var(--gold)',serie:'var(--cyan)',filme:'var(--violet)'};
var THEMES=['Ação','Aventura','Animação','Comédia','Crime','Documentário','Drama','Fantasia','Ficção científica','Romance','Suspense','Terror','Outro'];
var COLORS=['#1d8fa0,#0a1b22','#6a52d6,#150f30','#1fa56b,#08201a','#c93a78,#280a18','#c99a2c,#271c06','#2f7fd6,#0a1730'];
var PATH={
  watching:'<circle cx="12" cy="12" r="9"/><path d="M10 8.8v6.4l5.2-3.2z"/>',
  paused:'<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.6L12 6.6l2.5-2M9.5 19.4L12 17.4l2.5 2"/>',
  planned:'<path d="M7 4h10v16l-5-3.5L7 20z"/>',
  done:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7 5.5-5.5"/>',
  dropped:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
  serie:'<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4"/>',
  filme:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',home:'<path d="M4 11l8-6.5 8 6.5V20h-5v-5H9v5H4z"/>',
  stats:'<path d="M5 20V11M12 20V5M19 20v-6"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+PATH[n]+'</svg>'}

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(Array.isArray(d))S.items=d}}catch(e){}
  try{var p=localStorage.getItem(PKEY);if(p)P=Object.assign(P,JSON.parse(p))}catch(e){}
  if(P.homeType==='filme'||P.homeType==='serie')S.type=P.homeType}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.items))}catch(e){}}
function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
var toastT;
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(function(){S.toast='';render()},1900)}
function top(){try{window.scrollTo(0,0)}catch(x){}}
function count(type,status){return S.items.filter(function(i){return i.type===type&&(!status||i.status===status)}).length}
function pad(n){return n<10?'0'+n:String(n)}
function themeOpts(sel,first){return '<option value="'+first[0]+'">'+first[1]+'</option>'+THEMES.map(function(t){return '<option value="'+t+'"'+(t===sel?' selected':'')+'>'+t+'</option>'}).join('')}
function stars(n){var s='';for(var i=1;i<=5;i++)s+=i<=n?'★':'☆';return s}
function chkUrl(t,type){return 'https://www.google.com/search?q='+encodeURIComponent((t||'').trim()+' '+(type==='filme'?'filme':'série'))}
function greet(){var h=new Date().getHours();return h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function plural(n,a,b){return n+' '+(n===1?a:b)}

function headerHTML(){var n=S.items.length;
  return '<header><button class="brand" data-a="cover" aria-label="Abrir capa"><span class="mark">'+ic('watching')+'</span><span class="bn">Minha <span class="grad">Telinha</span></span></button>'
   +(n&&S.view!=='home'?'':(n?'<span class="pill" style="--c:var(--violet)">'+plural(n,'título','títulos')+'</span>':''))+'</header>'}

/* ---------- início ---------- */
function homeView(){
  var h='<section class="hero rise"><p class="eyebrow">'+greet()+' · sua sala</p><h2 class="h-big">O que vamos <span class="grad">ver hoje?</span></h2></section>';
  h+='<div class="types" role="group" aria-label="Escolha o tipo">'+['serie','filme'].map(function(t,i){
    var tot=count(t),w=count(t,'watching'),on=S.type===t;
    return '<button class="ty g'+(on?' hot':'')+' rise" style="--c:'+COL[t]+';--d:'+(i+1)+'" data-a="type" data-v="'+t+'" aria-pressed="'+on+'">'+ic(t)
     +'<span class="t-l">'+(t==='serie'?'Séries':'Filmes')+'</span><span class="ul"></span><span class="t-m">'+plural(tot,'título','títulos')+(w?' · '+w+' em andamento':'')+'</span></button>'}).join('')+'</div>';
  h+='<div class="sec rise" style="--d:3"><p class="eyebrow">'+(S.type==='serie'?'Suas séries':'Seus filmes')+' · escolha a situação</p></div>';
  h+='<div class="sts">'+ORDER.map(function(k,i){var n=count(S.type,k);
    return '<button class="st g'+(k==='watching'&&n?' hot':'')+(n?'':' zero')+' rise" style="--c:'+COL[k]+';--d:'+(i+4)+'" data-a="open" data-v="'+k+'" aria-label="'+SHELF[k]+': '+n+'">'
     +'<span class="st-top">'+ic(k)+'<span class="st-n">'+pad(n)+'</span></span>'
     +'<span class="st-l">'+SHELF[k]+'</span><span class="ul"></span><span class="st-d">'+DESC[S.type][k]+'</span></button>'}).join('')+'</div>';
  if(S.sample)h+='<div class="helper g" style="--c:var(--gold)"><b>Você está vendo exemplos</b><p>Esses títulos não são seus. Ao salvar o primeiro título real, eles somem.</p><div class="acts"><button class="btn ghost" data-a="clearsample">Sair dos exemplos</button></div></div>';
  else if(!S.items.length)h+='<div class="helper g rise" style="--c:var(--cyan);--d:9"><b>Sua sala está vazia</b><p>Adicione a série ou o filme que você está vendo agora.</p><div class="acts"><button class="btn" data-a="new">Adicionar título</button><button class="btn ghost" data-a="sample">Ver com exemplos</button></div></div>';
  return h}

/* ---------- lista ---------- */
function filtered(){var q=S.q.trim().toLowerCase();
  return S.items.filter(function(i){return i.type===S.type&&i.status===S.status&&(S.theme==='all'||i.theme===S.theme)&&(!q||i.title.toLowerCase().indexOf(q)>-1)})
   .sort(function(a,b){return (b.updated||0)-(a.updated||0)})}
function posterHTML(it){var c=COLORS[hash(it.title)%COLORS.length].split(',');
  var ini=it.title.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();
  return '<div class="poster" style="background:linear-gradient(160deg,'+c[0]+','+c[1]+')">'+esc(ini)+'<small>'+(it.type==='filme'?'FILME':'SÉRIE')+'</small></div>'}
function cardHTML(it,i){
  var acts='';
  if(it.type==='serie'&&it.status!=='done'&&it.status!=='planned'&&it.status!=='paused'){
    acts+='<button class="sbtn pri" data-a="ep" data-id="'+it.id+'">+1 episódio</button>';
    acts+='<button class="sbtn" data-a="season" data-id="'+it.id+'">Nova temporada</button>';}
  if(it.status==='planned'||it.status==='dropped'||it.status==='paused')acts+='<button class="sbtn pri" data-a="start" data-id="'+it.id+'">'+(it.status==='planned'?'Começar':'Retomar')+'</button>';
  if(it.type==='filme'&&it.status!=='done')acts+='<button class="sbtn'+(it.status==='watching'?' pri':'')+'" data-a="finish" data-id="'+it.id+'">Marcar visto</button>';
  if(it.type==='serie'&&it.status==='watching')acts+='<button class="sbtn" data-a="finish" data-id="'+it.id+'">Concluir</button>';
  acts+='<button class="sbtn" data-a="edit" data-id="'+it.id+'">Editar</button>';
  var prog=it.type==='serie'&&it.status!=='planned';
  return '<div class="card g'+(it.status==='watching'?' hot':'')+' rise" style="--c:'+COL[it.status]+';--d:'+Math.min(i,6)+'">'+posterHTML(it)+'<div class="info"><h3>'+esc(it.title)+'</h3><span class="ul"></span>'
   +((it.theme||it.rating)?'<div class="meta">'+(it.theme?'<span class="pill" style="--c:'+COL[it.status]+'">'+esc(it.theme)+'</span>':'')+(it.rating?'<span class="stars" aria-label="Nota '+it.rating+' de 5">'+stars(it.rating)+'</span>':'')+'</div>':'')
   +(prog?'<div class="now'+(it.status==='watching'?' on':'')+'" aria-label="Temporada '+it.season+', episódio '+it.ep+'"><span><small>Temporada</small>'+it.season+'</span><span><small>Episódio</small>'+it.ep+'</span>'
      +(it.status==='watching'?'<button class="minus" data-a="epm" data-id="'+it.id+'" aria-label="Voltar um episódio">−</button>':'')+'</div>':'')
   +(it.note?'<div class="note">“'+esc(it.note)+'”</div>':'')
   +'<div class="row">'+acts+'</div></div></div>'}
function listView(){
  var list=filtered(),h='',tn=S.type==='serie'?'série':'filme';
  h+='<div class="topbar"><button class="back" data-a="home">'+ic('back')+'Início</button></div>';
  h+='<div class="l-head"><p class="eyebrow">'+(S.type==='serie'?'Séries':'Filmes')+'</p><h2><span class="grad">'+SHELF[S.status]+'</span><span>'+count(S.type,S.status)+'</span></h2></div>';
  h+='<div class="chips" role="group" aria-label="Trocar situação">'+ORDER.map(function(k){return '<button class="chip" style="--c:'+COL[k]+'" data-a="ls" data-v="'+k+'" aria-pressed="'+(S.status===k)+'">'+SHELF[k]+' · '+count(S.type,k)+'</button>'}).join('')+'</div>';
  h+='<div class="tools"><input id="q" type="text" placeholder="Buscar título" value="'+esc(S.q)+'" aria-label="Buscar título">'
   +'<select id="flt-theme" aria-label="Filtrar por gênero">'+themeOpts(S.theme,['all','Todos os gêneros'])+'</select></div>';
  if(!list.length){
    var any=count(S.type,S.status);
    h+='<div class="empty g" style="--c:'+COL[S.status]+'"><b>'+(any?'Nada com esse filtro':'Nenhum'+(S.type==='serie'?'a série':' filme')+' aqui')+'</b>'
     +(any?'Mude a busca ou o gênero.':'Adicione um'+(S.type==='serie'?'a':'')+' '+tn+' em '+SHELF[S.status]+'.')
     +(any?'':'<div class="acts" style="justify-content:center"><button class="btn" data-a="new-here">Adicionar aqui</button></div>')+'</div>';
  }else h+='<div class="list">'+list.map(cardHTML).join('')+'</div>';
  return h}

/* ---------- resumo ---------- */
function statsView(){
  var it=S.items,c={watching:0,paused:0,planned:0,done:0,dropped:0},rs=0,rn=0;
  it.forEach(function(i){if(c[i.status]!=null)c[i.status]++;if(i.rating){rs+=i.rating;rn++}});
  var tot=it.length||1;
  var h='<div class="l-head" style="padding-top:20px"><p class="eyebrow">Sua sala</p><h2><span class="grad">Resumo</span></h2></div><div class="grid" style="margin-top:12px">'
   +'<div class="stat g" style="--c:var(--cyan)"><b>'+count('serie')+'</b><span>séries</span></div>'
   +'<div class="stat g" style="--c:var(--violet)"><b>'+count('filme')+'</b><span>filmes</span></div>'
   +'<div class="stat g" style="--c:var(--green)"><b>'+c.done+'</b><span>concluídos</span></div>'
   +'<div class="stat g" style="--c:var(--gold)"><b>'+(rn?(rs/rn).toFixed(1):'–')+'</b><span>nota média</span></div></div>';
  h+='<div class="sec"><p class="eyebrow">Por situação</p></div><div class="panel g" style="--c:var(--pink)"><div class="bars" role="img" aria-label="Distribuição por situação">'+ORDER.map(function(k){return '<div style="width:'+(c[k]/tot*100)+'%;background:'+COL[k]+';color:'+COL[k]+'"></div>'}).join('')+'</div>'
   +'<div class="legend">'+ORDER.map(function(k){return '<span><i style="background:'+COL[k]+';color:'+COL[k]+'"></i>'+SHELF[k]+' '+c[k]+'</span>'}).join('')+'</div></div>';
  var best=it.filter(function(i){return i.rating>=4}).sort(function(a,b){return b.rating-a.rating}).slice(0,5);
  if(best.length)h+='<div class="sec"><p class="eyebrow">Mais bem avaliados</p></div><div class="panel g" style="--c:var(--gold)">'+best.map(function(i){return '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0"><span style="font-weight:700">'+esc(i.title)+'</span><span class="stars">'+stars(i.rating)+'</span></div>'}).join('')+'</div>';
  h+='<div class="sec"><p class="eyebrow">Backup</p></div><div class="panel g" style="--c:var(--teal)"><p>Os dados ficam só neste aparelho e navegador. Copie o texto abaixo para guardar uma cópia, ou cole uma cópia aqui para restaurar.</p>'
   +'<textarea class="bk" id="bk" aria-label="Texto de backup">'+esc(JSON.stringify(it))+'</textarea>'
   +'<div class="acts"><button class="btn ghost" data-a="copy">Copiar</button><button class="btn" data-a="restore">Restaurar</button></div></div>';
  if(S.sample)h+='<div class="acts"><button class="btn ghost" data-a="clearsample">Sair dos exemplos</button></div>';
  else if(it.length)h+='<div class="acts"><button class="btn ghost" data-a="wipe">'+(S.armed==='wipe'?'Toque de novo para apagar tudo':'Apagar toda a lista')+'</button></div>';
  return h}

/* ---------- edição ---------- */
function sheetHTML(){
  var e=S.edit,isNew=!e.id;
  var h='<div class="sheetbg" data-a="close"><div class="sheet g" style="--c:'+COL[e.status]+'" role="dialog" aria-label="'+(isNew?'Adicionar':'Editar')+' título"><div class="grab"></div><h2>'+(isNew?'Novo título':'Editar título')+'</h2>';
  h+='<label for="f-title">Título</label><input id="f-title" type="text" value="'+esc(e.title)+'" placeholder="Ex.: Breaking Bad" autocomplete="off">'
   +'<a id="f-check" class="sbtn check" target="_blank" rel="noopener noreferrer" href="'+chkUrl(e.title,e.type)+'">Conferir título na internet ↗</a>';
  h+='<span class="lbl">Tipo</span><div class="seg">'+[['serie','Série'],['filme','Filme']].map(function(t){return '<button class="chip" style="--c:'+COL[t[0]]+'" data-a="ftype" data-v="'+t[0]+'" aria-pressed="'+(e.type===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  h+='<span class="lbl">Situação</span><div class="seg">'+ORDER.map(function(k){return '<button class="chip" style="--c:'+COL[k]+'" data-a="fstat" data-v="'+k+'" aria-pressed="'+(e.status===k)+'">'+STAT[k]+'</button>'}).join('')+'</div>';
  h+='<label for="f-theme">Gênero</label><select id="f-theme">'+themeOpts(e.theme,['','Sem gênero'])+'</select>';
  if(e.type==='serie')h+='<div class="two"><div><label for="f-season">Temporada</label><input id="f-season" type="number" min="1" inputmode="numeric" value="'+e.season+'"></div><div><label for="f-ep">Episódio</label><input id="f-ep" type="number" min="0" inputmode="numeric" value="'+e.ep+'"></div></div>';
  h+='<span class="lbl">Nota</span><div class="stars-in">'+[1,2,3,4,5].map(function(n){return '<button data-a="frate" data-v="'+n+'" class="'+(e.rating>=n?'on':'')+'" aria-label="'+n+' estrelas">★</button>'}).join('')+'<button class="sbtn" data-a="frate" data-v="0" style="margin-left:8px">Limpar</button></div>';
  h+='<label for="f-note">Anotação</label><textarea id="f-note" placeholder="Onde assistir, o que achou...">'+esc(e.note)+'</textarea>';
  h+='<div class="acts"><button class="btn" data-a="savef">Salvar</button><button class="btn ghost" data-a="close2">Cancelar</button></div>'
   +(isNew?'':'<div class="acts" style="margin-top:8px"><button class="btn ghost" data-a="del" style="color:var(--pink)">'+(S.armed==='del'?'Toque de novo para excluir':'Excluir título')+'</button></div>')+'</div></div>';
  return h}

/* ---------- capa ---------- */
function flagText(w,cls,off){var n=w.length;
  return '<div class="flag '+cls+'" aria-hidden="true">'+w.split('').map(function(ch,i){return '<span style="--i:'+(i+off)+';--j:'+i+';--n:'+n+'">'+esc(ch)+'</span>'}).join('')+'</div>'}
function coverHTML(){
  var it=S.items,w=0,pz=0,d=0;it.forEach(function(i){if(i.status==='watching')w++;else if(i.status==='paused')pz++;else if(i.status==='done')d++});
  var pills=it.length&&!S.sample
    ?'<span class="pill" style="--c:var(--pink)">'+w+' assistindo</span><span class="pill" style="--c:var(--teal)">'+pz+' na geladeira</span><span class="pill" style="--c:var(--green)">'+d+' concluídos</span>'
    :'<span class="pill" style="--c:var(--cyan)">Séries</span><span class="pill" style="--c:var(--violet)">Filmes</span><span class="pill" style="--c:var(--pink)">Episódios</span>';
  return '<div class="cover" role="dialog" aria-label="Capa"><div class="amb"></div>'
  +'<p class="eyebrow">Sua sala de cinema</p>'
  +'<div class="tv" role="img" aria-label="TV mostrando Minha Telinha"><div class="tv-ant"><i></i><i></i></div>'
  +'<div class="tv-body g hot" style="--c:var(--violet)"><div class="screen"><span class="onair">NO AR</span>'+flagText('Minha','sm',0)+flagText('Telinha','',5)+'</div><span class="tv-led"></span></div>'
  +'<div class="tv-stand"></div><div class="tv-foot"></div></div>'
  +'<p class="tag">Séries e filmes num só lugar, do primeiro episódio ao último.</p><div class="pills">'+pills+'</div>'
  +'<button class="btn" data-a="start-cover">Começar</button></div>'}

function render(){
  var app=document.getElementById('app'),ae=document.activeElement,act=ae&&ae.id,pos=null;
  if(act==='q')pos=ae.selectionStart;
  var body=S.view==='list'?listView():S.view==='stats'?statsView():homeView();
  app.innerHTML=headerHTML()+body;
  var homeOn=S.view!=='stats';
  document.getElementById('layer').innerHTML='<nav><div class="bar"><button data-a="home" '+(homeOn?'aria-current="page"':'')+'>'+ic('home')+'Início</button>'
    +'<button class="add" data-a="new" aria-label="Adicionar título">'+ic('plus')+'</button>'
    +'<button data-a="v-stats" '+(!homeOn?'aria-current="page"':'')+'>'+ic('stats')+'Resumo</button></div></nav>'
    +(S.edit?sheetHTML():'')+(S.cover?coverHTML():'')+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');
  if(S.focusTitle){S.focusTitle=false;var ft=document.getElementById('f-title');if(ft)ft.focus()}
  if(act==='q'){var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}
}

function find(id){return S.items.filter(function(i){return i.id===id})[0]}
function touch(i){i.updated=Date.now();save()}
function blank(){return{id:'',title:'',type:P.lastType||'serie',status:P.lastStatus||'watching',season:1,ep:0,rating:0,note:'',theme:''}}
function readForm(){var e=S.edit,t=document.getElementById('f-title');if(t)e.title=t.value;
  var th=document.getElementById('f-theme');if(th)e.theme=th.value;
  var s=document.getElementById('f-season'),p=document.getElementById('f-ep'),n=document.getElementById('f-note');
  if(s)e.season=Math.max(1,parseInt(s.value,10)||1);if(p)e.ep=Math.max(0,parseInt(p.value,10)||0);if(n)e.note=n.value}
function openList(type,status){S.type=type;S.status=status;S.q='';S.theme='all';S.view='list';P.homeType=type;savePrefs();top()}

document.addEventListener('change',function(ev){if(ev.target.id==='flt-theme'){S.theme=ev.target.value;render()}});
document.addEventListener('input',function(ev){
  if(ev.target.id==='f-title'&&S.edit){S.edit.title=ev.target.value;var a=document.getElementById('f-check');if(a)a.href=chkUrl(ev.target.value,S.edit.type)}
  if(ev.target.id==='q'){S.q=ev.target.value;render()}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.edit){S.edit=null;render()}});
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id'),it;
  if(a==='close'&&ev.target!==el)return;
  if(a!=='del'&&a!=='wipe')S.armed='';
  switch(a){
  case'cover':S.cover=true;break;
  case'start-cover':S.cover=false;top();break;
  case'home':S.view='home';top();break;
  case'v-stats':S.view='stats';top();break;
  case'type':S.type=v;P.homeType=v;savePrefs();break;
  case'open':openList(S.type,v);break;
  case'ls':S.status=v;S.q='';S.theme='all';break;
  case'new':S.edit=blank();S.focusTitle=true;break;
  case'new-here':S.edit=blank();S.edit.type=S.type;S.edit.status=S.status;S.focusTitle=true;break;
  case'edit':S.edit=Object.assign({},find(id));break;
  case'close':case'close2':S.edit=null;break;
  case'ftype':readForm();S.edit.type=v;break;
  case'fstat':readForm();S.edit.status=v;break;
  case'frate':readForm();S.edit.rating=+v;break;
  case'savef':readForm();var e=S.edit;
    if(!e.title.trim()){toast('Digite o título');return}
    e.title=e.title.trim();
    if(S.sample){S.items=[];S.sample=false}
    if(e.id){var o=find(e.id);if(o){Object.assign(o,e);touch(o)}else{e.updated=Date.now();S.items.push(e);save()}}
    else{e.id=uid();e.updated=Date.now();S.items.push(e);save()}
    P.lastType=e.type;P.lastStatus=e.status;savePrefs();
    S.edit=null;openList(e.type,e.status);toast('Salvo em '+(e.type==='serie'?'Séries':'Filmes')+' · '+SHELF[e.status]);return;
  case'del':if(S.armed!=='del'){S.armed='del';break}
    S.items=S.items.filter(function(i){return i.id!==S.edit.id});save();S.edit=null;S.armed='';toast('Excluído');return;
  case'ep':it=find(id);it.ep++;touch(it);toast(it.title+': T'+it.season+' · E'+it.ep);return;
  case'epm':it=find(id);if(it.ep>0){it.ep--;touch(it)}break;
  case'season':it=find(id);it.season++;it.ep=0;it.status='watching';touch(it);toast(it.title+': temporada '+it.season);return;
  case'start':it=find(id);it.status='watching';touch(it);toast('Movido para Assistindo');return;
  case'finish':it=find(id);it.status='done';touch(it);S.edit=Object.assign({},it);toast('Concluído. Que tal dar uma nota?');return;
  case'sample':loadSample();break;
  case'clearsample':S.items=[];S.sample=false;save();S.view='home';break;
  case'wipe':if(S.armed!=='wipe'){S.armed='wipe';break}S.items=[];save();S.armed='';S.view='home';toast('Lista apagada');return;
  case'copy':var ta=document.getElementById('bk');ta.select();
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('Copiado')},function(){toast('Texto selecionado. Copie pelo menu do celular')})}catch(x){toast('Texto selecionado. Copie pelo menu do celular')}return;
  case'restore':try{var d=JSON.parse(document.getElementById('bk').value);if(!Array.isArray(d))throw 0;
      S.items=d.filter(function(x){return x&&x.title}).map(function(x){return Object.assign(blank(),x,{id:x.id||uid()})});save();S.sample=false;toast('Restaurado: '+S.items.length+' títulos')}catch(x){toast('Texto de backup inválido')}return;
  }
  render()});
